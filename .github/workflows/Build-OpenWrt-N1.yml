name: Build OpenWrt N1

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "底包版本 (官方OpenWrt稳定版)"
        required: false
        default: "25.12.6"
        type: choice
        options:
          - 25.12.6
          - 25.12.5
          - 25.12.4
          - 25.12.3
          - 25.12.2
          - 25.12.1
          - 25.12.0
      openwrt_kernel:
        description: "内核系列"
        required: false
        default: "6.18.y"
        type: choice
        options:
          - 6.18.y
          - 6.12.y
      packaging_tool:
        description: "打包工具 (Ophub / Flippy)"
        required: true
        default: 'ophub'
        type: choice
        options:
          - 'ophub'
          - 'flippy'
      include_passwall:
        description: "集成 PassWall (含核心与源)"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      include_smartdns:
        description: "集成 SmartDNS"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/n1/build-firmware.sh
      
      # ================= 1. 编译底包 (官方 OpenWrt) =================
      - name: Building OpenWrt rootfs
        run: |
          docker run --rm -i \
            --user root \
            -w /builder \
            -v "${{ github.workspace }}/bin:/builder/bin" \
            -v "${{ github.workspace }}/files/etc/uci-defaults:/builder/files/etc/uci-defaults" \
            -v "${{ github.workspace }}/shell:/builder/shell" \
            -v "${{ github.workspace }}/n1/banner:/builder/files/mnt/banner" \
            -v "${{ github.workspace }}/n1/build-firmware.sh:/builder/build.sh" \
            -e PROFILE=generic \
            -e ROOTFS_PARTSIZE="1024" \
            -e TARGET_OS="OpenWrt" \
            -e INCLUDE_PASSWALL="${{ github.event.inputs.include_passwall }}" \
            -e INCLUDE_SMARTDNS="${{ github.event.inputs.include_smartdns }}" \
            openwrt/imagebuilder:armsr-armv8-${{ github.event.inputs.luci_version }} /bin/bash /builder/build.sh
      
      - name: Find compiled rootfs
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8/ -type f -name "*rootfs.tar.gz" | head -n1)
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      # ================= 2. Ophub 打包路线 =================
      - name: Package with Ophub
        if: ${{ github.event.inputs.packaging_tool == 'ophub' }}
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: ${{ steps.find_rootfs.outputs.file }}
          openwrt_board: s905d
          openwrt_kernel: ${{ github.event.inputs.openwrt_kernel }}
          kernel_repo: "ophub/kernel"
          kernel_usage: "stable"
          auto_kernel: true
          builder_name: "lemon1203"

      - name: Collect Ophub Output
        if: ${{ github.event.inputs.packaging_tool == 'ophub' }}
        run: |
          mkdir -p ${{ github.workspace }}/output
          cp ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz ${{ github.workspace }}/output/

      # ================= 3. Flippy 打包路线 =================
      - name: Package with Flippy
        if: ${{ github.event.inputs.packaging_tool == 'flippy' }}
        uses: lemon1203/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMVIRT: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: ${{ github.event.inputs.openwrt_kernel }}
          KERNEL_AUTO_LATEST: true
          WHOAMI: "lemon1203"

      - name: Collect Flippy Output
        if: ${{ github.event.inputs.packaging_tool == 'flippy' }}
        run: |
          mkdir -p ${{ github.workspace }}/output
          cp ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz ${{ github.workspace }}/output/

      # ================= 4. 筛选最新内核版本并重命名 =================
      - name: Rename Firmware
        id: rename
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(${{ github.workspace }}/output/*.img.gz)
          if [ "${#FILES[@]}" -eq 0 ]; then 
            echo "❌ 找不到生成的固件！"
            exit 1
          fi
          
          LATEST_KERNEL=$(ls ${{ github.workspace }}/output/*.img.gz | grep -oP 'k\d+\.\d+\.\d+' | sort -V | tail -n1)
          FILE=$(ls ${{ github.workspace }}/output/*${LATEST_KERNEL}*.img.gz | head -n1)
          
          ARTIFACT_NAME="openwrt-${{ github.event.inputs.luci_version }}-n1-${{ github.event.inputs.packaging_tool }}-$LATEST_KERNEL.img.gz"
          mv "$FILE" "${{ github.workspace }}/output/$ARTIFACT_NAME"
          
          echo "artifact=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "✅ 已挑选出最新内核固件: $ARTIFACT_NAME"

      # ================= 5. 上传至 Release =================
      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phicomm-n1-openwrt
          name: Official OpenWrt for Phicomm N1
          files: ${{ github.workspace }}/output/${{ steps.rename.outputs.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
