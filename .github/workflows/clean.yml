name: Delete old workflow runs
on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # 这里精确指定你要删除的工作流名称！
          delete_workflow_pattern: "Build 25.12.x N1"
          retain_days: 0
          keep_minimum_runs: 0
