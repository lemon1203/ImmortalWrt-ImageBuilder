# ==========================================================================
# 官方 OpenWrt（armvirt/armsr）+ ophub/flippy 内核 -> 斐讯 N1
#
# 真正的构建逻辑在 build-n1.yml（可复用工作流）里，这里只负责
# 提供中文输入项、并发控制和"官方 OpenWrt"这一组参数。
# ==========================================================================
name: Build OpenWrt N1

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "底包版本 (官方 OpenWrt 稳定版)"
        required: true
        default: "25.12.6"
        type: choice
        options:
          - 25.12.6
          - 25.12.5
          - 25.12.4
          - 25.12.3
          - 25.12.2
          - 25.12.1
          - 25.12.0
      openwrt_kernel:
        description: "内核系列（ophub 路线会同时产出 6.12/6.18，这里决定最终上传哪个系列）"
        required: true
        default: "6.18.y"
        type: choice
        options:
          - 6.18.y
          - 6.12.y
      packaging_tool:
        description: "打包工具 (Ophub / Flippy)"
        required: true
        default: "ophub"
        type: choice
        options:
          - ophub
          - flippy
      include_passwall:
        description: "集成 PassWall (含核心与源)"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      include_smartdns:
        description: "集成 SmartDNS"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      dry_run:
        description: "只构建不上传 Release（调试用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 同一时间只跑一个，避免两次构建往同一个 Release 里写
concurrency:
  group: n1-openwrt
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-n1.yml
    with:
      distro: openwrt
      version: ${{ inputs.luci_version }}
      kernel_series: ${{ inputs.openwrt_kernel }}
      packaging_tool: ${{ inputs.packaging_tool }}
      include_passwall: ${{ inputs.include_passwall }}
      include_smartdns: ${{ inputs.include_smartdns }}
      release_tag: phicomm-n1-openwrt
      release_name: Official OpenWrt for Phicomm N1
      dry_run: ${{ inputs.dry_run }}
